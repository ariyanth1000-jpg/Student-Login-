<!DOCTYPE html>
<html>
<head>
<title>Trending Academy LTD</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* LOGIN */
.loginBox{
  max-width:420px;
  margin:120px auto;
  background:#111827;
  padding:20px;
  border-radius:12px;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#22c55e;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
}

/* PROFILE */
.profile{
  display:none;
  max-width:900px;
  margin:30px auto;
  background:#111827;
  padding:20px;
  border-radius:14px;
}

/* BORDER */
.activeProfile{border:2px solid #22c55e;}
.inactiveProfile{border:2px solid #ef4444;}

/* HEADER */
.header{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#22c55e;
}

.sub{
  text-align:center;
  opacity:0.6;
  margin-bottom:15px;
}

/* 🔥 ROW FIX (NO OVERFLOW, AUTO SHRINK) */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;

  padding:5px 0;

  /* IMPORTANT */
  width:100%;
  overflow:hidden;
}

/* LEFT */
.label{
  flex:1;

  background:#1f2937;
  padding:6px 8px;
  border-radius:18px;

  font-size:12px;

  text-align:center;

  /* 🔥 AUTO SHRINK */
  white-space:nowrap;
  min-width:0;
  overflow:hidden;
}

/* RIGHT */
.value{
  flex:1;

  background:#0b1220;
  padding:6px 8px;
  border-radius:18px;

  font-size:12px;
  font-weight:bold;

  text-align:center;

  white-space:nowrap;
  min-width:0;
  overflow:hidden;

  border:1px solid #334155;
}

/* FOOTER */
.footer{
  margin-top:20px;
  padding-top:10px;
  border-top:1px solid #334155;
  text-align:center;
  font-size:12px;
  opacity:0.8;
  line-height:1.6;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="loginBox" id="loginBox">

<h3 style="text-align:center;">Login</h3>

<input id="phone" placeholder="WhatsApp Number">
<input id="password" placeholder="Password">

<button onclick="login()">LOGIN</button>

<div id="loading" style="text-align:center;margin-top:10px;"></div>

</div>

<!-- PROFILE -->
<div class="profile" id="profile">

<div class="header">Trending Academy LTD</div>
<div class="sub">Profile Information</div>

<div id="content"></div>

<div class="footer">
CEO: Ananna Afrin Anu <br>
Owner: MD Tamim <br>
Bhola, Barisal, Dhaka, Bangladesh
</div>

</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbwOiNS5ISa9IsVZp5VX01ij5uPVFVSDCY2VOn0apDUNeQasVJabT2VwD3J3kUR_JGE6wg/exec";

function add(label,value){
  return `<div class="row">
    <div class="label">${label}</div>
    <div class="value">${value}</div>
  </div>`;
}

function login(){

document.getElementById("loading").innerText="Checking...";

fetch(URL,{
  method:"POST",
  body:new URLSearchParams({
    phone:phone.value,
    password:password.value
  })
})
.then(r=>r.json())
.then(d=>{

  document.getElementById("loading").innerText="";

  if(d.status!=="VERIFIED"){
    document.getElementById("loading").innerText="Login Failed ❌";
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("profile").style.display="block";

  let box=document.getElementById("profile");

  if(d.M && d.M.trim()!==""){
    box.classList.add("activeProfile");
  }else{
    box.classList.add("inactiveProfile");
  }

  let html="";

  if(d.M && d.M.trim()!==""){

    html += add("Student ID", d.A);
    html += add("Account Status", d.M);
    html += add("Name", d.B);
    html += add("Language", d.C);
    html += add("Gender", d.D);
    html += add("Country", d.E);
    html += add("DOB", d.F);
    html += add("Age", d.AGE);
    html += add("Balance", d.O);
    html += add("Phone", d.G);
    html += add("WhatsApp", d.H);
    html += add("Email", d.I);
    html += add("Invitation", d.K);
    html += add("Registration", d.L);
    html += add("Advisor", d.P);

  } else {

    html += add("Student ID", d.A);
    html += add("Name", d.B);
    html += add("WhatsApp", d.H);
    html += add("Balance", d.O + " (Pending)");
    html += add("Status", "Inactive");

  }

  document.getElementById("content").innerHTML = html;

});

}

</script>

</body>
</html>
