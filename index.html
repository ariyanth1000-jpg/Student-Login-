<!DOCTYPE html>
<html>
<head>
<title>Trending Academy LTD</title>

<style>
/* ====== BASE ====== */
body{
  margin:0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #f8fafc, #e0f2fe, #dbeafe);
  color: #0f172a;
  min-height: 100vh;
}

/* ====== LOGIN BOX ====== */
.loginBox{
  max-width:420px;
  margin:120px auto;
  background:#ffffff;
  padding:25px;
  border-radius:18px;
  border:10px solid #c4b5fd;
  box-shadow:0 10px 30px rgba(59,130,246,.15);
  transition:.3s;
}

.loginBox:hover{
  transform:translateY(-3px);
}

/* ====== INPUT ====== */
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:3px solid #cbd5e1;
  background:white;
  color:#0f172a;
  font-size:14px;
  transition:.3s;
}

input:focus{
  outline:none;
  border-color:#3b82f6;
  box-shadow:0 0 10px rgba(59,130,246,.2);
}

/* ====== BUTTON ====== */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  font-size:14px;
  background:linear-gradient(90deg, #3b82f6, #2563eb);
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.03);
  box-shadow:0 10px 20px rgba(37,99,235,.25);
}

/* ====== LOADING ====== */
#loading{
  font-size:14px;
  font-weight:bold;
  color:#2563eb;
  margin-top:10px;
  text-align:center;
  animation: blink 1s infinite;
}

@keyframes blink{
  0%,50%,100%{opacity:1;}
  25%,75%{opacity:0;}
}

/* ====== PROFILE ====== */
.profile{
  display:none;
  max-width:900px;
  margin:30px auto;
  background:#ffffff;
  padding:25px;
  border-radius:20px;
  border:5px solid #cbd5e1;
  box-shadow:0 15px 40px rgba(59,130,246,.12);
  transition:.3s;
}

.profile.activeProfile{
  border:10px solid #22c55e;
}

.profile.inactiveProfile{
  border:5px solid #ef4444;
}

.profile:hover{
  transform:translateY(-3px);
}

/* ====== HEADER ====== */
.header{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#2563eb;
}

.sub{
  text-align:center;
  color:#64748b;
  margin-bottom:15px;
  font-size:14px;
}

/* ====== ROW ====== */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:6px 0;
  width:100%;
  overflow:hidden;
}

.label{
  flex:1;
  background:#f1f5f9;
  color:#0f172a;
  padding:8px;
  border-radius:20px;
  font-size:12px;
  text-align:center;
  white-space:nowrap;
  min-width:0;
  overflow:hidden;
  transition:.3s;
}

.label:hover{
  background:#e2e8f0;
}

.value{
  flex:1;
  background:#eff6ff;
  color:#1e3a8a;
  padding:8px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  text-align:center;
  border:1px solid #bfdbfe;
  white-space:nowrap;
  min-width:0;
  overflow:hidden;
  transition:.3s;
}

.value:hover{
  background:#dbeafe;
  border-color:#3b82f6;
}

/* ====== FOOTER ====== */
.footer{
  margin-top:20px;
  padding-top:10px;
  border-top:5px solid #60a5fa;
  text-align:center;
  color:#475569;
  font-size:12px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="loginBox" id="loginBox">
<h3 style="text-align:center; color:#2563eb;">Student Login Page</h3>
<input id="phone" placeholder="✆ Whatsapp Number">
<input id="password" placeholder="🔐 Password" type="text">
<button onclick="login()">╰┈➤ LOGIN NOW</button>
<div id="loading"></div>
</div>

<!-- PROFILE -->
<div class="profile" id="profile">
<div class="header">Trending Academy LTD</div>
<div class="sub">🎓 Profile Information ꫂ❁</div>
<div id="content"></div>
<div class="footer">
♛ CEO: Ananna Afrin Anu ❀ <br>
👑 Owner: MD Tamim (×̷̷͜×̷) <br>
📍 Office: Bhola, Barisal, Dhaka, Bangladesh 🇧🇩
</div>
</div>

<script>
const URL="https://script.google.com/macros/s/AKfycbwOiNS5ISa9IsVZp5VX01ij5uPVFVSDCY2VOn0apDUNeQasVJabT2VwD3J3kUR_JGE6wg/exec";

function add(label,value){
  return `<div class="row">
    <div class="label">${label}</div>
    <div class="value">${value}</div>
  </div>`;
}

function login(){
  document.getElementById("loading").innerText="Checking...";

  fetch(URL,{
    method:"POST",
    body:new URLSearchParams({
      phone:phone.value,
      password:password.value
    })
  })
  .then(r=>r.json())
  .then(d=>{
    document.getElementById("loading").innerText="";
    if(d.status!=="VERIFIED"){
      document.getElementById("loading").innerText="Login Failed ❌";
      return;
    }

    document.getElementById("loginBox").style.display="none";
    document.getElementById("profile").style.display="block";

    let box=document.getElementById("profile");
    if(d.M && d.M.trim()!==""){
      box.classList.add("activeProfile");
    }else{
      box.classList.add("inactiveProfile");
    }

    let html="";
    if(d.M && d.M.trim()!==""){
      html += add("🪪 Student ID", d.A);
      html += add("❦ Status", d.M);
      html += add("🪼 Full Name", d.B);
      html += add("友 Language", d.C);
      html += add("🚻 Gender", d.D);
      html += add("🌎 Country", d.E);
      html += add("🎂 Date of Birth", d.F);
      html += add("⏰ Age Now", d.AGE);
      html += add("💸 Balance info", d.O);
      html += add("✆ Phone No ", d.G);
      html += add("📞 WhatsApp", d.H);
      html += add("💌 Email ID", d.I);
      html += add("🏷️ Invitation", d.K);
      html += add("🗓️ Registration", d.L);
      html += add("👨🏻‍🎓 Team Advisor", d.P);
    }else{
      html += add("🪪 Student ID", d.A);
      html += add("👨🏻‍🎓Full Name", d.B);
      html += add("✆ Whatsapp", d.H);
      html += add("🏦 Balance", d.O + " (Pending)");
      html += add("🔄 Status", "Inactive 🔴");
    }
    document.getElementById("content").innerHTML = html;
  });
}
</script>
<style>
.menuBtn{
  position:fixed;
  top:10px;
  right:10px;
  z-index:9999;
  background:#111827;
  border:1px solid #334155;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  font-size:22px;
  color:white;
}

.sideMenu{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  background:#111827;
  z-index:10000;
  transition:.3s;
  padding:15px;
  box-sizing:border-box;
}

.menuItem{
  background:#1f2937;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  cursor:pointer;
  text-align:center;
  color:white;
}

#webview{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  border:none;
  z-index:9998;
  background:#fff;
}
</style>

<div class="menuBtn" onclick="toggleMenu()">☰</div>

<div class="sideMenu" id="sideMenu">

  <div class="menuItem" onclick="closeWebView()">👤 Profile Page 🪪</div>

  <div class="menuItem" onclick="openWebView('LINK')">🏦 Credits History 💲</div>
  <div class="menuItem" onclick="openWebView('LINK')"> ✄ Debits History ✂️</div>
  <div class="menuItem" onclick="openWebView('LINK')">📚 Classroom 🎒</div>
  <div class="menuItem" onclick="openWebView('LINK')">🏧 Withdraw Now 💸</div>
  <div class="menuItem" onclick="openWebView('LINK')">➜]🚪 Log out 📡</div>

</div>

<iframe id="webview"></iframe>

<script>
function toggleMenu(){

  const menu=document.getElementById("sideMenu");

  if(menu.style.left==="0px"){
    menu.style.left="-260px";
  }else{
    menu.style.left="0px";
  }

}

function openWebView(url){

  document.getElementById("webview").style.display="block";
  document.getElementById("webview").src=url;

  toggleMenu();

}

function closeWebView(){

  document.getElementById("webview").style.display="none";
  document.getElementById("webview").src="";

  toggleMenu();

}
</script>
</body>
</html>
